[package]
name = "lokalen"
version = "0.1.0"
description = "Meddelanden för rummet du arbetar i"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri's mobile targets build the app as a library and call into it from a
# generated Xcode/Gradle entry point, so the desktop binary links this too.
name = "lokalen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "fs", "io-util", "sync", "time", "signal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scrypt = "0.11.0"
sha2 = "0.10.9"
rand = "0.9.5"
uuid = { version = "1.20.0", features = ["v4"] }
hex = "0.4.3"
futures-util = "0.3.34"
local-ip-address = "0.6.13"
tower-http = { version = "0.7.0", features = ["cors"] }
tokio-util = { version = "0.7.19", features = ["io"] }
socket2 = "0.6.5"
gethostname = "1.1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "charset", "http2"] }

[profile.release]
# Small binary and low resident memory matter more here than raw speed: the
# app spends its life idle waiting on a socket.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
