name: Wrait Comms

# Cross-compiling to Windows is possible but never as trustworthy as building
# on the real thing, and Apple's toolchain is macOS-only, so each platform
# builds on its own runner.
on:
  push:
    paths: ["comms/**", ".github/workflows/comms-build.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: comms

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: comms/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: comms/apps/desktop/src-tauri

      # Tauri needs the system webview headers to compile on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Rust relay tests
        working-directory: comms/apps/desktop/src-tauri
        run: cargo test

      - run: pnpm --filter @comms/desktop exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Browser suite against the Node relay
        run: pnpm --filter @comms/desktop exec playwright test messaging
      - name: Build the embedded relay binary
        working-directory: comms/apps/desktop/src-tauri
        run: cargo build --bin relay
      - name: Browser suite against the embedded Rust relay
        run: pnpm --filter @comms/desktop exec playwright test --config=playwright.rust.config.ts

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: comms/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: comms/apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @comms/desktop tauri build

      # The portable exe is the headline artifact: self-contained, with the
      # frontend and the relay compiled in. The installers are for people who
      # would rather install than carry a file around.
      - name: Upload the portable exe
        uses: actions/upload-artifact@v4
        with:
          name: wrait-comms-windows-portable
          path: comms/apps/desktop/src-tauri/target/release/wrait-comms.exe
          if-no-files-found: error

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: wrait-comms-windows-installers
          path: |
            comms/apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            comms/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: comms/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: comms/apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      # A universal binary so one download covers Apple silicon and Intel.
      - run: pnpm --filter @comms/desktop tauri build --target universal-apple-darwin

      - name: Upload the macOS app
        uses: actions/upload-artifact@v4
        with:
          name: wrait-comms-macos
          path: |
            comms/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            comms/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
