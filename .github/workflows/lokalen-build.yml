name: Lokalen

# Cross-compiling to Windows is possible but never as trustworthy as building
# on the real thing, and Apple's toolchain is macOS-only, so each platform
# builds on its own runner.
on:
  push:
    paths: ["lokalen/**", ".github/workflows/lokalen-build.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: lokalen

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lokalen/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lokalen/apps/desktop/src-tauri

      # Tauri needs the system webview headers to compile on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Rust relay tests
        working-directory: lokalen/apps/desktop/src-tauri
        run: cargo test

      - run: pnpm --filter @lokalen/desktop exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Browser suite against the Node relay
        run: pnpm --filter @lokalen/desktop exec playwright test messaging
      - name: Build the embedded relay binary
        working-directory: lokalen/apps/desktop/src-tauri
        run: cargo build --bin relay
      - name: Browser suite against the embedded Rust relay
        run: pnpm --filter @lokalen/desktop exec playwright test --config=playwright.rust.config.ts

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      # Read once here so the signing step can branch on its presence: a
      # secret cannot be tested directly in an `if` expression.
      CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lokalen/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lokalen/apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Signing is optional: without a certificate the build still runs and
      # produces an unsigned exe, which is what SmartScreen warns about.
      - name: Import the signing certificate
        id: cert
        if: ${{ env.CERT != '' }}
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        working-directory: .
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT)
          $path = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path -Force
          "thumbprint=$($imported.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build (signed)
        if: ${{ steps.cert.outputs.thumbprint != '' }}
        run: >
          pnpm --filter @lokalen/desktop tauri build --config
          '{"bundle":{"windows":{"certificateThumbprint":"${{ steps.cert.outputs.thumbprint }}","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}'

      - name: Build (unsigned)
        if: ${{ steps.cert.outputs.thumbprint == '' }}
        run: pnpm --filter @lokalen/desktop tauri build

      # The portable exe is the headline artifact: self-contained, with the
      # frontend and the relay compiled in. The installers are for people who
      # would rather install than carry a file around.
      - name: Upload the portable exe
        uses: actions/upload-artifact@v4
        with:
          name: lokalen-windows-portable
          path: lokalen/apps/desktop/src-tauri/target/release/lokalen.exe
          if-no-files-found: error

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: lokalen-windows-installers
          path: |
            lokalen/apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            lokalen/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lokalen/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lokalen/apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      # A universal binary so one download covers Apple silicon and Intel.
      - run: pnpm --filter @lokalen/desktop tauri build --target universal-apple-darwin

      - name: Upload the macOS app
        uses: actions/upload-artifact@v4
        with:
          name: lokalen-macos
          path: |
            lokalen/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            lokalen/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
